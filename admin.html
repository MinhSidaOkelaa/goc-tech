<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Admin — Góc Tech</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--sub:#5a5a5a;--bg2:#f6f6f6;--line:#e2e2e2;--side:#1d1f22;--amber:#fff6e0;--amberb:#e8c66a;--green:#eaf6ee;--greenb:#9fd0b0;--red:#fdecec;--redb:#e5a5a5}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 "Be Vietnam Pro",Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.b,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;font-weight:600;border:1px solid var(--ink);text-decoration:none;background:#fff}
.b{background:var(--ink);color:#fff}.b2:hover{background:var(--bg2)}.b:disabled,.b2:disabled{background:var(--bg2);color:#8a8a8a;border-color:var(--line);cursor:not-allowed}
h1{font-size:22px;margin:0;letter-spacing:-.01em}h2{font-size:16px;margin:0}.sub{color:var(--sub)}.small{font-size:13px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#fff}
.tag.wait{background:var(--amber);border-color:var(--amberb)}.tag.ok{background:var(--green);border-color:var(--greenb)}.tag.bad{background:var(--red);border-color:var(--redb)}
.err{font-weight:600;font-size:13.5px;margin-top:6px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#d6d6d6;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff;padding:0 8px 16px}.side .logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#fff;color:var(--side);font-style:normal}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;text-decoration:none;color:#cfcfcf;margin-bottom:2px}.side a:hover{background:#2a2d31;color:#fff}.side a.on{background:#3a3e44;color:#fff;font-weight:700}
.side .n{background:#fff;color:var(--side);border-radius:99px;font-size:12px;font-weight:700;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.side .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#8d9096;padding:16px 10px 6px}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13.5px}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;min-width:40px;min-height:40px}
.body{padding:20px 24px 48px;max-width:1240px}
.panel{border:1px solid var(--line);border-radius:10px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px}.stat:hover{border-color:var(--ink)}.stat b{display:block;font-size:26px;line-height:1.2}.stat span{font-size:13.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12.5px;color:var(--sub);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}.bar input,.bar select{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}.bar input{flex:1;min-width:180px}
.cards{display:none}.ocard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;margin-bottom:10px}.ocard .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ocard .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:13.5px}
.empty{padding:36px 16px;text-align:center;color:var(--sub)}.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 37%,#f0f0f0 63%);background-size:400% 100%;animation:sk 1.2s ease infinite}@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}.head .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}.sec{padding:16px}.sec+.sec{border-top:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;gap:12px;margin:4px 0}
.todo{border:1px solid var(--ink);border-radius:10px}.todo ul{margin:6px 0 10px;padding-left:18px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}textarea.bad{border:2px solid var(--ink)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}.tl li:first-child{border-top:0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto}.mail{border:1px solid var(--line);border-radius:10px;margin:16px;padding:16px;background:var(--bg2)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}.seg button{border:0;background:#fff;min-height:38px;padding:0 12px;font-weight:500;border-right:1px solid var(--line)}.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:#fff}
.dhead input[type=date]{min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px}
.stat small{display:block;color:var(--sub);font-size:12.5px;margin-top:4px}.stat .cap{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;align-items:start}.dgrid.two{grid-template-columns:1fr 1fr}.ch{padding:16px}.ch h2{margin-bottom:4px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.barrow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;margin:10px 0}.stack{display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}.stack a,.stack span{display:grid;place-items:center;font-size:12.5px;font-weight:700;text-decoration:none;min-width:26px;color:#fff}
.c-ok{background:#2f7d57}.c-wait{background:#b7791f}.c-bad{background:#b3261e}.c-ink{background:#171717}.c-none{background:#9a9a9a}
svg a:focus-visible rect,svg a:focus-visible circle{stroke:#000;stroke-width:2}svg a{cursor:pointer}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px}.tabsbar a{padding:10px 14px;text-decoration:none;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}.tabsbar a.on{color:var(--ink);border-bottom-color:var(--ink)}
.wf td,.wf th{font-size:13.5px}.wf tr.stuck{background:var(--red)}.scrollx{overflow-x:auto;max-width:100%}.dgrid>*{min-width:0}.ref{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--sub)}
.envt{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-top:3px;white-space:nowrap;background:#fff}.envt.real{border-color:var(--ink)}
.int{display:grid;grid-template-columns:180px auto minmax(0,1fr);gap:6px 14px;padding:14px 16px;font-size:14px;align-items:baseline}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .15s}.side.open{transform:none}.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
 .menu{display:inline-grid;place-items:center}.top{padding:10px 16px}.top .who .nm{display:none}.body{padding:16px 16px 40px}
 .stats{grid-template-columns:1fr 1fr}.dgrid,.dgrid.two{grid-template-columns:minmax(0,1fr)}.barrow{grid-template-columns:1fr;gap:4px}.wf{min-width:640px}.tablewrap{display:none}.cards{display:block}.cols{grid-template-columns:1fr}
 .tl li{grid-template-columns:1fr;gap:4px}.int{grid-template-columns:1fr;gap:2px}.int b{margin-top:8px}
}
</style></head><body>
<div class="app"><aside class="side" id="side" aria-label="Điều hướng admin"><div class="logo"><i>G</i>Góc Tech</div><nav id="nav"></nav></aside>
<div><header class="top"><button class="menu" id="menu" aria-label="Mở menu" aria-expanded="false" onclick="toggleMenu()">☰</button><h1 id="title">Tổng quan</h1>
<div class="who"><span class="nm" id="who"></span><button class="b2" style="min-height:34px;padding:0 12px" onclick="logout()">Đăng xuất</button></div></header>
<main class="body" id="view"></main></div></div><div id="ov"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('vi-VN')+' ₫';
const dt=t=>t?new Date(t*1000).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
const tm=t=>t?new Date(t*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
async function api(path,body){let r;try{r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}catch(e){return {ok:false,net:true,message:'Mất kết nối tới máy chủ.'}}if(r.status===403||r.status===401){location.reload();return {ok:false,message:'Phiên admin đã hết.'}}try{return await r.json()}catch(e){return {ok:false,message:'Máy chủ trả dữ liệu lỗi.'}}}
const F=[['all','Tất cả trạng thái'],['needs','Cần xử lý'],['hold','Chờ duyệt'],['confirm','Chờ thanh toán'],['recon','Cần đối soát'],['paid','Đã thanh toán'],['ship_issue','Giao hàng cần xử lý']];
const ENVN={all:'Tất cả',real:'Stripe Sandbox',sim:'Giả lập'};
const vnDay=(off=0)=>new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Ho_Chi_Minh'});
const dayOf=t=>t?new Date(t*1000).toLocaleDateString('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}):'';
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
const listUrl=o=>{const q=new URLSearchParams();Object.entries(o).forEach(([k,v])=>{if(v&&v!=='all')q.set(k,v)});return '/admin/orders'+(q.toString()?'?'+q:'')};
const PAGE=10;let tickets=[],flow=[],tReply={},rows=null,ints=[],loadErr='',det=null,detErr='',note='',reasonErr=false,busy=false,timer=null;
const cls=t=>/^Chờ|đang tạo|^Đang chờ/.test(t)?'wait':/^Đã thanh toán|^Đã duyệt|^Đã tạo|^Đang giao|^Đã giao|^Đã gửi/.test(t)?'ok':/Cần xử lý|cần đối soát|Cần tạo lại|thất bại|từ chối|Chưa tạo được/i.test(t)?'bad':'';
const tag=t=>`<span class="tag ${cls(t)}">${esc(t)}</span>`;
const tags=o=>(o.order_status==='CANCELED'?tag('Đã từ chối'):tag(o.review_label))+tag(o.pay_label)+tag(o.ship_label)+(o.notify_label?tag(o.notify_label):'');
/* ---------- điều hướng: /admin, /admin/orders?q=&f=&p=, /admin/orders/ORD-001 ---------- */
function where(){const p=location.pathname.replace(/\/$/,''),q=new URLSearchParams(location.search);const m=p.match(/^\/admin\/orders\/(.+)$/);if(m)return {page:'detail',id:decodeURIComponent(m[1]),tab:q.get('tab')||'info'};if(p==='/admin/support')return {page:'support',t:q.get('t')||''};if(p==='/admin/stock')return {page:'stock'};if(p==='/admin/orders')return {page:'list',q:q.get('q')||'',f:q.get('f')||'all',p:Math.max(1,+q.get('p')||1),kind:q.get('kind')||'',from:q.get('from')||'',to:q.get('to')||'',env:q.get('env')||'',risk:q.get('risk')||'',issue:q.get('issue')||''};return {page:'home',r:q.get('r')||'7d',env:q.get('env')||'all',from:q.get('from')||'',to:q.get('to')||''}}
function nav(url,replace){history[replace?'replaceState':'pushState'](null,'',url);closeMenu();note='';reasonErr=false;stock=null;const w=where();if(!(w.page==='detail'&&det&&det.id===w.id)){det=null;detErr=''}render();if(w.page==='home')loadDash();if(w.page==='detail'&&!det)loadDetail(w.id);if(location.hash!=='#stuck')window.scrollTo(0,0)}
window.addEventListener('popstate',()=>{const w=where();if(!(w.page==='detail'&&det&&det.id===w.id)){det=null;detErr=''}note='';render();if(w.page==='home')loadDash();if(w.page==='detail'&&!det)loadDetail(w.id)});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-nav]');if(a){e.preventDefault();nav(a.getAttribute('href'))}});
function toggleMenu(){const s=$('side'),open=!s.classList.contains('open');s.classList.toggle('open',open);$('menu').setAttribute('aria-expanded',open);const sh=document.querySelector('.shade');if(open&&!sh){const d=document.createElement('div');d.className='shade';d.onclick=closeMenu;document.body.appendChild(d)}else if(sh)sh.remove()}
function closeMenu(){$('side').classList.remove('open');$('menu').setAttribute('aria-expanded',false);const sh=document.querySelector('.shade');if(sh)sh.remove()}
const count=k=>rows?rows.filter(o=>k==='all'||o.buckets.includes(k)).length:0;
function sidebar(w){const hold=count('hold');const it=(href,label,on,n)=>`<a data-nav href="${href}" class="${on?'on':''}" ${on?'aria-current="page"':''}><span>${label}</span>${n?`<span class="n">${n}</span>`:''}</a>`;
 $('nav').innerHTML=it('/admin','Tổng quan',w.page==='home')+it('/admin/orders','Đơn hàng',(w.page==='list'&&w.f!=='hold'&&w.f!=='recon')||w.page==='detail')+it('/admin/orders?f=hold','Chờ duyệt',w.page==='list'&&w.f==='hold',hold)+it('/admin/orders?f=recon','Cần đối soát',w.page==='list'&&w.f==='recon',count('recon'))+it('/admin/stock','Kho hàng',w.page==='stock')+it('/admin/support','Hỗ trợ đơn hàng',w.page==='support',tickets.filter(t=>t.status!=='Đóng').length)
 +'<div class="grp">Công cụ demo</div><a href="/demo"><span>Demo workflow</span></a><a href="/admin/tech"><span>Bảng kỹ thuật</span></a><a href="/" target="_blank"><span>Cửa hàng ↗</span></a>'}
/* ---------- tải dữ liệu ---------- */
async function load(){const tk=await api('/api/admin/tickets');if(tk.tickets){tickets=tk.tickets;flow=tk.flow}const r=await api('/api/admin/orders');if(r.orders){rows=r.orders;ints=r.integrations||[];loadErr=''}else loadErr=r.message||'Không tải được dữ liệu.';const w=where();if(w.page==='detail')await loadDetail(w.id);else if(w.page==='home')loadDash();else render()}
async function loadDetail(id){const typing=document.activeElement&&document.activeElement.id==='reason';const r=await api('/api/admin/order',{order_id:id});if(r.ok){const changed=JSON.stringify(r.order)!==JSON.stringify(det);det=r.order;detErr='';if(changed&&!typing&&!busy)render()}else{detErr=r.net?r.message:'Không tìm thấy đơn này (có thể đã bị xóa khi đặt lại demo).';det=null;render()}}
/* ---------- các trang ---------- */
const skel=n=>Array.from({length:n},()=>'<div style="padding:14px 16px;border-bottom:1px solid var(--line)"><div class="sk" style="width:55%"></div></div>').join('');
const failBox=()=>`<div class="panel empty" role="alert"><b style="color:var(--ink)">Không tải được dữ liệu.</b><p>${esc(loadErr)}</p><button class="b" onclick="load()">Thử lại</button></div>`;
function orderTable(list,emptyText){if(!list.length)return `<div class="panel empty">${emptyText}</div>`;
 return `<div class="panel tablewrap" style="overflow-x:auto"><table><thead><tr><th>Mã đơn</th><th>Thời gian</th><th>Tổng tiền</th><th>Duyệt</th><th>Thanh toán</th><th>Giao hàng</th></tr></thead><tbody>${list.map(o=>`<tr class="row" tabindex="0" onclick="openOrder('${o.id}')" onkeydown="if(event.key==='Enter')openOrder('${o.id}')"><td><b>${o.id}</b>${o.demo?' <span class="tag">demo</span>':''}</td><td class="mono" style="white-space:nowrap">${dt(o.created_at)}</td><td style="white-space:nowrap">${money(o.amount)}</td><td>${o.order_status==='CANCELED'?tag('Đã từ chối'):tag(o.review_label)}</td><td>${tag(o.pay_label)}</td><td>${tag(o.ship_label)}</td></tr>`).join('')}</tbody></table></div>
 <div class="cards">${list.map(o=>`<div class="ocard"><div class="r"><b>${o.id}</b><b>${money(o.amount)}</b></div><div class="sub small">${dt(o.created_at)}${o.demo?' · demo':''}</div><div class="tags">${tags(o)}</div><button class="b2" style="width:100%" onclick="openOrder('${o.id}')">Mở chi tiết</button></div>`).join('')}</div>`}
function openOrder(id){sessionStorage.setItem('gt_admin_back',location.pathname+location.search);nav('/admin/orders/'+encodeURIComponent(id));loadDetail(id)}
/* ---------- Tổng quan vận hành: số liệu do backend tổng hợp (GET /api/admin/dashboard) ---------- */
let dash=null,dashErr='',dashKey='',dashBusy=false;
function dashRange(w){if(w.r==='today')return [vnDay(),vnDay()];if(w.r==='30d')return [vnDay(-29),vnDay()];if(w.r==='custom'&&w.from&&w.to)return w.from<=w.to?[w.from,w.to]:[w.to,w.from];return [vnDay(-6),vnDay()]}
async function loadDash(force){const w=where();if(w.page!=='home'||dashBusy)return;const [f,t]=dashRange(w),key=f+'|'+t+'|'+w.env;if(key!==dashKey){dash=null;dashErr='';dashKey=key;render()}
 dashBusy=true;let d=null;try{const r=await fetch(`/api/admin/dashboard?from=${f}&to=${t}&env=${w.env}`);if(r.status===403||r.status===401){location.reload();return}d=await r.json()}catch(e){}dashBusy=false;
 if(key!==dashKey)return loadDash();const same=o=>JSON.stringify({...o,generated_at:0});
 if(d&&d.ok){const changed=!dash||same(d)!==same(dash);dash=d;dashErr='';if(changed||force)render();else if($('upd'))$('upd').textContent=tm(d.generated_at)}else{dashErr='Chưa tải được số liệu';if(!dash||force){dash=null;render()}}}
function setDash(patch){const w=Object.assign(where(),patch),q=new URLSearchParams();if(w.r!=='7d')q.set('r',w.r);if(w.env!=='all')q.set('env',w.env);if(w.r==='custom'){q.set('from',w.from||vnDay(-6));q.set('to',w.to||vnDay())}history.replaceState(null,'','/admin'+(q.toString()?'?'+q:''));render();loadDash()}
function goList(o){sessionStorage.setItem('gt_admin_back',location.pathname+location.search);nav(listUrl(o))}
function openStuck(id){sessionStorage.setItem('gt_admin_back',location.pathname+location.search);nav('/admin/orders/'+encodeURIComponent(id)+'?tab=workflow#stuck');loadDetail(id)}
const moneyList=v=>v.length?v.map(x=>x.currency==='VND'?money(x.amount):Number(x.amount).toLocaleString('vi-VN')+' '+x.currency).join(' + '):money(0);
function barChart(d,base){const W=720,H=250,L=34,B=30,T=16,n=d.series.length,max=Math.max(1,...d.series.map(s=>Math.max(s.created,s.paid))),pw=W-L-8,ph=H-B-T,gw=pw/n,bw=Math.max(3,Math.min(22,gw*0.36)),step=Math.ceil(n/10),y=v=>T+ph-(v/max)*ph;
 const ticks=[...new Set([0,Math.ceil(max/2),max])];
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột: đơn tạo và đơn thanh toán thành công theo ngày" style="width:100%;height:auto;display:block">${ticks.map(v=>`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e2e2"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5a5a5a">${v}</text>`).join('')}

 else if(o.ship_check)todo=`<h2>Giao hàng cần xử lý <span class="tag">GHN giả lập</span></h2><p class="small sub" style="margin:6px 0 10px">${o.ship_check==='unknown'?'GHN không phản hồi khi tạo vận đơn nên chưa rõ vận đơn đã được tạo hay chưa. Đối soát trước để tránh tạo hai vận đơn. Đơn vẫn giữ trạng thái đã thanh toán.':'Đã đối soát: GHN xác nhận chưa có vận đơn cho đơn này. Có thể tạo lại.'}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" ${busy?'disabled':''} onclick="ship('reconcile')">${busy==='reconcile'?'Đang đối soát…':'Đối soát vận đơn'}</button><button class="b2" ${o.ship_check==='confirmed_none'&&!busy?'':'disabled'} onclick="ship('retry-shipment')">Thử tạo lại</button></div>${o.ship_check==='unknown'?'<p class="small sub" style="margin:8px 0 0">“Thử tạo lại” chỉ mở sau khi đối soát xác nhận chưa có vận đơn.</p>':''}`;
 else if(o.workflow.stuck&&o.workflow.stuck.action==='reconcile-email')todo=`<h2>Email cần đối soát <span class="tag">Brevo giả lập</span></h2><p class="small sub" style="margin:6px 0 10px">${esc(o.workflow.stuck.label)}. Chưa rõ email đã gửi hay chưa nên hệ thống không tự gửi lại.</p>${stuckActions(o)}`;
 else todo=`<h2>Không có việc cần xử lý</h2><p class="small sub" style="margin:6px 0 0">${o.order_status==='CANCELED'?'Đơn đã bị từ chối.':o.payment_status==='PENDING'?'Đang chờ khách thanh toán hoặc chờ cổng thanh toán xác nhận.'+(o.pay_action==='resume'?'</p><p class="small" style="margin:10px 0 0"><button class="b2" style="min-height:34px" '+(busy?'disabled':'')+' onclick="expireSess()">Cho phiên thanh toán hết hạn</button><br><span class="sub">Công cụ thử nghiệm: khách sẽ thấy nút “Thanh toán lại”.</span>':''):o.tracking_code?'Đơn đã có vận đơn.':'Hệ thống đang tự xử lý các bước tiếp theo.'}</p>`;
 const rev=o.reviewed_at?`<p class="small" style="margin:10px 0 0"><b>${o.review_result==='approved'?'Đã duyệt':'Đã từ chối'}</b> bởi ${esc(o.reviewed_by||'admin')} lúc ${dt(o.reviewed_at)}${o.reject_reason?'<br><b>Lý do:</b> '+esc(o.reject_reason):''}</p>`:'';
 return backLink+`<div class="head"><div><h1 style="font-size:26px">Đơn ${o.id}</h1><div class="sub small">Tạo lúc ${dt(o.created_at)} · ${esc(o.name)} · ${esc(o.email)}</div><div class="tags">${tags(o)}</div></div><div style="text-align:right"><div class="sub small">Tổng tiền</div><b style="font-size:24px">${money(o.amount)}</b></div></div>${tabsBar(o,'info')}
 <div class="cols"><div><div class="panel"><div class="sec"><h2 style="margin-bottom:10px">Sản phẩm</h2>${o.lines.map(l=>`<div class="sum"><span>${esc(l.name)}<br><span class="sub small">Phiên bản: ${esc(l.variant)} · Số lượng ${l.qty} · Đơn giá ${money(l.price)}</span></span><span style="white-space:nowrap">${money(l.price*l.qty)}</span></div>`).join('')}</div>
 <div class="sec"><div class="sum sub"><span>Tạm tính</span><span>${money(o.subtotal)}</span></div><div class="sum sub"><span>Giảm giá</span><span>${o.discount?'− '+money(o.discount):'0 ₫'}</span></div><div class="sum sub"><span>Phí giao hàng</span><span>${money(o.shipping_fee)}</span></div><div class="sum" style="font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><span>Tổng tiền</span><span>${money(o.amount)}</span></div></div>
 <div class="sec"><h2 style="margin-bottom:6px">Giao đến</h2><span class="small">${esc(o.address)}${o.area_name?'<br><span class="sub">Khu vực: '+esc(o.area_name)+(o.eta?' · dự kiến '+esc(o.eta):'')+' · phí giao theo bảng ước tính</span>':''}</span>${o.tracking_code?`<br><span class="small">Mã vận đơn GHN: <span class="mono">${esc(o.tracking_code)}</span></span>`:''}</div></div></div>
 <div><div class="todo sec"><div class="sub small" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Cần xử lý</div>${todo}${note?`<p class="small" role="status" style="margin:12px 0 0;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:8px 12px">${esc(note)}</p>`:''}${rev}</div>
 ${tickets.filter(t=>t.order_id===o.id).length?`<div class="panel" style="margin-top:16px"><div class="sec"><h2 style="margin-bottom:8px">Yêu cầu hỗ trợ</h2>${tickets.filter(t=>t.order_id===o.id).map(t=>`<div class="sum" style="align-items:center"><span><a data-nav href="/admin/support?t=${t.id}"><b>${t.id}</b></a> · ${esc(t.topic)}</span>${tkTag(t.status)}</div>`).join('')}</div></div>`:''}<div class="panel" style="margin-top:16px"><div class="sec"><h2 style="margin-bottom:8px">Email Brevo <span class="tag">Giả lập</span></h2>${o.email_previews.map((m,i)=>`<div class="sum" style="align-items:center"><span><b>${esc(m.template)}</b><br><span class="sub small">${m.sent_at?'Đã tạo lúc '+tm(m.sent_at):'Chưa tạo · '+esc(m.condition)}</span></span><button class="b2" style="min-height:34px;padding:0 12px;white-space:nowrap" onclick="mail(${i})">Xem trước email</button></div>`).join('')}</div></div></div></div>
 <div class="panel" style="margin-top:16px"><div class="sec" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>Nhật ký xử lý</h2><span class="mono sub">order_status=${o.order_status} · payment_status=${o.payment_status} · risk=${o.risk} · thanh toán: ${o.pay_mode==='real'?'Stripe Sandbox thật':'giả lập'}</span></div>
 <ol class="tl">${o.events.map(e=>{const dup=e.detail.includes('đã xử lý: bỏ qua');const [c,t]=dup?['wait','Trùng, bỏ qua']:{OK:['ok','Thành công'],FAIL:['bad','Lỗi / dừng'],WARN:['wait','Cảnh báo'],INFO:['','Ghi nhận']}[e.status]||['',e.status];return `<li><span class="mono sub">${tm(e.time)}</span><span><b>${esc(e.step.replace(/^\d+\.\s*/,''))}</b> · ${esc(e.service)}<br><span class="sub small">${esc(e.detail)}</span></span><span><span class="tag ${c}">${t}</span></span></li>`}).join('')||'<li class="sub">Chưa có sự kiện.</li>'}</ol></div>`}
async function review(ok){if(busy)return;const reason=$('reason')?$('reason').value.trim():'';if(!ok&&!reason){reasonErr=true;render();$('reason').focus();return}reasonErr=false;busy=ok?'approve':'reject';render();const r=await api('/api/admin/review',{order_id:det.id,approve:ok,reason});busy=false;note=r.ok?(ok?'Đã duyệt. Khách có thể quay lại đơn để thanh toán.':'Đã từ chối và lưu lý do vào nhật ký.'):(r.message||'Chưa thực hiện được.');det=null;await load()}
async function ship(kind){if(busy)return;busy=kind;render();const r=await api('/api/admin/'+kind,{order_id:det.id});busy=false;note=!r.ok?(r.message||'Chưa thực hiện được.'):kind==='reconcile'?(r.found?'Đối soát: GHN đã có vận đơn '+r.tracking_code+'. Dùng lại mã này, không tạo vận đơn mới.':'Đối soát: GHN chưa có vận đơn. Bây giờ có thể bấm “Thử tạo lại”.'):'Đã tạo vận đơn.';det=null;await load()}
async function expireSess(){if(busy)return;busy='expire';render();const r=await api('/api/admin/expire-session',{order_id:det.id});busy=false;note=r.ok?'Đã cho phiên thanh toán hết hạn. Khách sẽ thấy nút “Thanh toán lại”.':(r.message||'Chưa thực hiện được.');det=null;await load()}
function mail(i){const m=det.email_previews[i];$('ov').innerHTML=`<div class="mask" onclick="if(event.target===this)$('ov').innerHTML=''"><div class="modal" role="dialog" aria-modal="true" aria-label="Xem trước email"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)"><h2>Xem trước email</h2><span class="tag wait">Bản xem trước · giả lập, không gửi thật</span></div>
 <div class="mail"><div class="small sub">Từ: Góc Tech &lt;donhang@goctech.example&gt; (qua Brevo)<br>Tới: ${esc(m.to)}</div><p style="margin:10px 0"><b>${esc(m.subject)}</b></p>${m.body.map(l=>`<p style="margin:6px 0">${esc(l)}</p>`).join('')}</div>
 <p class="small sub" style="margin:0 16px">Mẫu: ${esc(m.template)} · ${esc(m.condition)} · ${m.sent_at?'đã tạo lúc '+tm(m.sent_at):'chưa được tạo cho đơn này'}</p><div style="padding:16px;text-align:right"><button class="b" onclick="$('ov').innerHTML=''">Đóng</button></div></div></div>`}
function render(keepFocus){const w=where();sidebar(w);const titles={home:'Tổng quan vận hành',list:w.f==='hold'?'Chờ duyệt':w.f==='recon'?'Cần đối soát thanh toán':'Đơn hàng',detail:'Chi tiết đơn',support:'Hỗ trợ đơn hàng',stock:'Kho hàng'};$('title').textContent=titles[w.page];document.title=titles[w.page]+' — Admin Góc Tech';
 const pos=keepFocus&&$('q')?[$('q').selectionStart,$('q').selectionEnd]:null;$('view').innerHTML=w.page==='home'?home(w):w.page==='list'?list(w):w.page==='support'?support(w):w.page==='stock'?stockPage():detail(w);if(w.page==='detail'&&location.hash==='#stuck'&&$('stuck')&&!render._s){render._s=true;$('stuck').scrollIntoView({block:'center'})}if(w.page!=='detail')render._s=false;if(pos&&$('q')){$('q').focus();$('q').setSelectionRange(pos[0],pos[1])}}
async function logout(){await api('/api/admin/logout');location.href='/admin'}
(async()=>{const me=await api('/api/admin/me');if(me.ok)$('who').textContent=me.name+' · '+me.email;render();await load();timer=setInterval(()=>{const typing=document.activeElement&&['reason','q','treply'].includes(document.activeElement.id);if(!busy&&!typing&&!document.querySelector('.mask'))load()},4000)})();
</script></body></html>
